<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal — AaMilNa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --beige:#F7F2EC; --ivory:#FFFDF8; --blush:#F6D7D7; --blush-deep:#E8B4B4;
  --sage:#A8B89F; --rose-gold:#B76E79; --muted-gold:#C9A961; --deep-brown:#4A3B47;
  --shadow-soft:0 18px 45px rgba(74,59,71,0.08); --shadow-medium:0 25px 60px rgba(74,59,71,0.12);
  --radius:24px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--beige);color:var(--deep-brown);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.floral-bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 18% 12%, rgba(74,59,71,0.10), transparent 42%), radial-gradient(circle at 82% 22%, rgba(168,184,159,0.30), transparent 48%), linear-gradient(180deg,#FFFDF8 0%,#F7F2EC 100%);}
.auth-card{width:100%;max-width:440px;background:rgba(255,253,248,0.9);backdrop-filter:blur(18px);border-radius:32px;box-shadow:var(--shadow-medium);border:1px solid rgba(255,255,255,0.6);padding:50px 40px;text-align:center;}
.admin-badge{display:inline-block;background:linear-gradient(135deg,var(--deep-brown),var(--rose-gold));color:white;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:20px;}
.auth-card h2{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:8px;}
.auth-card p{font-size:14px;color:#6a5862;margin-bottom:30px;}
.input-group{margin-bottom:20px;text-align:left;}
.input-group label{display:block;font-size:12px;font-weight:500;color:#8A9A82;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
.input-group input{width:100%;padding:14px 18px;border-radius:16px;border:1.5px solid rgba(183,110,121,0.2);background:var(--ivory);font-family:'Poppins',sans-serif;font-size:14px;color:var(--deep-brown);outline:none;transition:0.3s;}
.input-group input:focus{border-color:var(--rose-gold);}
.auth-btn{width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--deep-brown),var(--rose-gold));color:white;font-family:'Poppins',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:0.3s;margin-top:10px;}
.auth-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(74,59,71,0.25);}
.auth-error{background:rgba(255, 107, 107, 0.1);color:#d9534f;border:1px solid rgba(255, 107, 107, 0.3);padding:12px;border-radius:12px;font-size:13px;margin-bottom:20px;display:none;}
.auth-error.show{display:block;}
.back-btn{display:inline-block;margin-top:20px;color:var(--rose-gold);text-decoration:none;font-size:13px;font-weight:500;}
</style>
</head>
<body>
<div class="floral-bg"></div>
<div class="auth-card">
  <div class="admin-badge">👑 CEO Access Only</div>
  <h2>Admin Portal</h2>
  <p>Authorized personnel only</p>
  <div class="auth-error" id="loginError"></div>
  <form id="adminLoginForm">
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="admin@aamilna.com" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="auth-btn" id="loginBtn">Secure Login</button>
  </form>
  <!-- FIX: Updated to Home.html -->
  <a href="Home.html" class="back-btn">← Back to Website</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHMIBHlYGqyw4U7ZZplwi4LgQxga99nLM",
  authDomain: "aamilna.firebaseapp.com",
  projectId: "aamilna",
  storageBucket: "aamilna.firebasestorage.app",
  messagingSenderId: "127180284017",
  appId: "1:127180284017:web:b024e50670228b085f7bd0"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errorDiv = document.getElementById('loginError');

  errorDiv.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const uid = userCredential.user.uid;

    // Strict Role Check
    const docSnap = await getDoc(doc(db, "users", uid));
    if (docSnap.exists() && docSnap.data().role === 'admin') {
      btn.textContent = 'Access Granted!';
      window.location.href = 'admin-dashboard.html';
    } else {
      // Not an admin! Sign them out immediately.
      await signOut(auth);
      throw { code: 'auth/unauthorized', message: 'Access Denied: You are not an Admin.' };
    }
  } catch (error) {
    let msg = error.message;
    if(error.code === 'auth/unauthorized') msg = 'Access Denied: You are not an Admin.';
    if(error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') msg = 'Invalid email or password.';
    errorDiv.textContent = msg;
    errorDiv.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Secure Login';
  }
});
</script>
</body>
</html>
