<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart — AaMilNa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@0,500;0,600;0,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --beige:#F7F2EC; --ivory:#FFFDF8; --blush:#F6D7D7; --blush-deep:#E8B4B4;
  --sage:#A8B89F; --sage-deep:#8A9A82; --rose-gold:#B76E79; --muted-gold:#C9A961;
  --deep-brown:#4A3B47; --shadow-soft:0 18px 45px rgba(74,59,71,0.08);
  --shadow-medium:0 25px 60px rgba(74,59,71,0.12); --radius:24px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:var(--beige);color:var(--deep-brown);line-height:1.65;}
.floral-bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 18% 12%, rgba(246,215,215,0.40), transparent 42%), linear-gradient(180deg,#FFFDF8 0%,#F7F2EC 100%);}

header{position:sticky;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 40px;z-index:1000;background:rgba(255,253,248,0.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(246,215,215,0.3);}
header img.logo{height:45px;cursor:pointer;}
.header-nav{display:flex;gap:15px;align-items:center;}
.header-btn{text-decoration:none;color:var(--deep-brown);font-weight:500;font-size:14px;padding:10px 20px;border-radius:20px;background:rgba(255,255,255,0.6);border:1px solid rgba(183,110,121,0.2);cursor:pointer;transition:0.3s;}
.header-btn:hover{background:var(--blush);}
.header-btn.primary{background:linear-gradient(135deg,var(--rose-gold),var(--blush-deep));color:white;border:none;}

.cart-container{max-width:1200px;margin:40px auto;padding:0 40px;display:grid;grid-template-columns:2fr 1fr;gap:30px;}
.page-title{font-family:'Playfair Display',serif;font-size:32px;margin-bottom:30px;}

.cart-items{display:flex;flex-direction:column;gap:20px;}
.cart-item{background:white;padding:20px;border-radius:16px;box-shadow:var(--shadow-soft);border:1px solid rgba(246,215,215,0.3);display:flex;gap:20px;align-items:center;position:relative;}
.cart-img{width:100px;height:100px;border-radius:12px;background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;flex-shrink:0;}
.cart-img img{width:100%;height:100%;object-fit:cover;}
.cart-info{flex:1;}
.cart-info h3{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:5px;}
.cart-info p{font-size:13px;color:#6a5862;margin-bottom:8px;}
.cart-price{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--rose-gold);}

.qty-selector{display:flex;align-items:center;gap:10px;margin-top:10px;}
.qty-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--rose-gold);background:white;color:var(--rose-gold);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.3s;}
.qty-btn:hover{background:var(--rose-gold);color:white;}
.qty-val{font-weight:500;min-width:20px;text-align:center;}

.remove-btn{position:absolute;top:20px;right:20px;background:none;border:none;color:#d9534f;cursor:pointer;font-size:13px;font-weight:500;text-decoration:underline;transition:0.3s;}
.remove-btn:hover{color:#a94442;}

.empty-cart{text-align:center;padding:80px 20px;background:white;border-radius:var(--radius);box-shadow:var(--shadow-soft);}
.empty-cart h3{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:10px;}
.empty-cart p{color:#6a5862;margin-bottom:20px;}

.summary-card{background:white;padding:30px;border-radius:16px;box-shadow:var(--shadow-soft);border:1px solid rgba(246,215,215,0.3);height:fit-content;position:sticky;top:100px;}
.summary-card h2{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid rgba(183,110,121,0.1);}
.summary-row{display:flex;justify-content:space-between;margin-bottom:15px;font-size:14px;color:#6a5862;}
.summary-row span{color:var(--deep-brown);font-weight:500;}
.summary-total{display:flex;justify-content:space-between;margin-top:20px;padding-top:20px;border-top:1px solid rgba(183,110,121,0.1);font-family:'Playfair Display',serif;font-size:20px;font-weight:600;}
.checkout-btn{width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--rose-gold),var(--blush-deep));color:white;font-family:'Poppins',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:0.3s;margin-top:20px;box-shadow:0 8px 20px rgba(183,110,121,0.25);}
.checkout-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(183,110,121,0.35);}
.checkout-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}

.toast{position:fixed;top:90px;right:20px;background:var(--ivory);padding:14px 22px;border-radius:14px;box-shadow:var(--shadow-medium);border-left:4px solid var(--sage-deep);font-size:13.5px;z-index:3000;transform:translateX(420px);transition:transform 0.4s;}
.toast.show{transform:translateX(0);}

@media(max-width:768px){
  .cart-container{grid-template-columns:1fr;padding:0 20px;}
  .summary-card{position:relative;top:0;}
  .cart-item{flex-direction:column;align-items:flex-start;text-align:center;width:100%;}
  .cart-img{width:100%;height:150px;}
  .remove-btn{top:10px;right:10px;}
}
</style>
</head>
<body>
<div class="floral-bg"></div>

<header>
  <img src="logo.png.jpeg" alt="AaMilNa Logo" class="logo" onclick="window.location.href='Home%20Page.html'">
  <div class="header-nav">
    <a href="shop.html" class="header-btn">🛍️ Continue Shopping</a>
    <a href="Home%20Page.html" class="header-btn primary">🏠 Home</a>
  </div>
</header>

<div class="cart-container">
  <div>
    <h1 class="page-title">Your Shopping Cart</h1>
    <div class="cart-items" id="cartItemsContainer">
      <!-- Cart items will be rendered here -->
    </div>
  </div>

  <div class="summary-card">
    <h2>Order Summary</h2>
    <div id="summaryContent">
      <!-- Summary will be rendered here -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCHMIBHlYGqyw4U7ZZplwi4LgQxga99nLM",
  authDomain: "aamilna.firebaseapp.com",
  projectId: "aamilna",
  storageBucket: "aamilna.firebasestorage.app",
  messagingSenderId: "127180284017",
  appId: "1:127180284017:web:b024e50670228b085f7bd0"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const toast = document.getElementById('toast');
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2800);
}

let cart = [];
try {
  cart = JSON.parse(localStorage.getItem('cartItems')) || [];
} catch(e) {
  cart = [];
}

function renderCart() {
  const container = document.getElementById('cartItemsContainer');
  const summaryContent = document.getElementById('summaryContent');

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="empty-cart">
        <h3>Your cart is empty</h3>
        <p>Looks like you haven't added any handmade treasures yet.</p>
        <a href="shop.html" class="header-btn primary" style="text-decoration:none; display:inline-block;">Explore Products</a>
      </div>
    `;
    summaryContent.innerHTML = `<p style="color:#6a5862; text-align:center;">Add items to your cart to see the summary.</p>`;
    return;
  }

  // Render Cart Items
  container.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="cart-img">${item.image ? `<img src="${item.image}" alt="${item.name}">` : item.emoji || '📦'}</div>
      <div class="cart-info">
        <h3>${item.name}</h3>
        <p>${item.seller || 'AaMilNa Artisan'}</p>
        <div class="cart-price">Rs. ${item.price * item.qty}</div>
        <div class="qty-selector">
          <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
        </div>
      </div>
      <button class="remove-btn" onclick="removeItem('${item.id}')">Remove</button>
    </div>
  `).join('');

  // Render Summary
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const delivery = subtotal > 5000 ? 0 : 200; // Free delivery over Rs. 5000
  const total = subtotal + delivery;

  summaryContent.innerHTML = `
    <div class="summary-row"><span>Subtotal (${cart.reduce((s,i)=>s+i.qty,0)} items)</span> <span>Rs. ${subtotal}</span></div>
    <div class="summary-row"><span>Delivery Fee</span> <span>${delivery === 0 ? 'FREE' : 'Rs. ' + delivery}</span></div>
    ${delivery === 0 ? '<p style="font-size:12px; color:var(--sage-deep); margin-top:5px;">🎉 You qualified for free delivery!</p>' : ''}
    <div class="summary-total"><span>Total</span> <span>Rs. ${total}</span></div>
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
  `;
}

window.changeQty = function(id, delta) {
  const item = cart.find(i => i.id === id);
  if (item) {
    item.qty += delta;
    if (item.qty <= 0) {
      removeItem(id);
    } else {
      localStorage.setItem('cartItems', JSON.stringify(cart));
      renderCart();
      updateCartBadge();
    }
  }
};

window.removeItem = function(id) {
  cart = cart.filter(i => i.id !== id);
  localStorage.setItem('cartItems', JSON.stringify(cart));
  renderCart();
  updateCartBadge();
  showToast('Item removed from cart.');
};

window.checkout = function() {
  showToast('🛒 Checkout feature coming soon!');
}

function updateCartBadge() {
  const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
  localStorage.setItem('cartCount', totalQty);
  // If the home page is open in another tab, it will pick this up
}

// Initialize
renderCart();

// Listen for auth state to keep header logic consistent if needed
onAuthStateChanged(auth, (user) => {
  // Can add role-based logic here later if needed
});
</script>
</body>
</html>
